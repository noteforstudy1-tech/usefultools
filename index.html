<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Useful Tools | noteforstudy1-tech</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 {
            color: #38bdf8;
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }
        p {
            color: #94a3b8;
            font-size: 1.2rem;
            max-width: 600px;
        }
        .status {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: #1e293b;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .pulse {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #10b981;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 0 rgba(16, 185, 129, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body>
    <h1>Useful Tools</h1>
    <p>The centralized hub for all scripts, utilities, and experiments by <strong>noteforstudy1-tech</strong>, built with the Gemini CLI.</p>
    
    <div class="status">
        <span class="pulse"></span> System Online & Connected to GitHub
    </div>
</body>
</html>
